# Über uns
about:
  hero:
    tagline: "Über uns"
    title: "SmartBuoy"
    subtitle: "Wer wir sind"
  cta:
    button: "Bleib auf dem Laufenden"
    banner-button: "Kontakt aufnehmen"
  intro:
    paragraph1: "**SmartBuoy entwickelt smarte Bojen, um Anlegen sicherer, komfortabler und ökologisch verantwortlicher zu machen.** Wir sind Skipper, Techniker und Unternehmer mit einer gemeinsamen Überzeugung:\nTechnologie soll das Leben auf dem Wasser einfacher machen, nicht komplizierter. Und sie soll die Natur schützen, nicht belasten."
    subheadline: "Smarte Bojen für Skipper von Skippern"
  story:
    title: "Wie alles begann"
    paragraph1: "SmartBuoy wurde 2023 von Michael, Georg und Jakob gegründet. Die Idee entstand nicht im Büro, sondern auf einer privaten Bootsfahrt."
    paragraph2: "Unsere Gründer Michi und Georg, Geschäftsführer eines Yachtbauunternehmens, standen vor einem alltäglichen Problem: Nicht dort anlegen zu können, wo man eigentlich hinmöchte, sondern dort, wo zufällig noch eine Boje frei ist. \n\nStatt einem entspannten Abend im Lieblingsrestaurant bedeutete das:"
    bullets: "unnötiges Bojensuchen|zusätzliche Fahrten|Treibstoffverschwendung|Stress am Ende eines eigentlich schönen Tages|Intrasparente Kosten"
    conclusion: "Aus diesem Frust wurde eine einfache Frage:\nWarum gibt es keine planbare, faire und nachhaltige Lösung für Bojenplätze?\n\nDie Antwort darauf ist SmartBuoy."
  timeline:
    title: "Vom Konzept zur Boje"
    subtitle: "SmartBuoy ist das Ergebnis jahrelanger Entwicklung, Tests und Lernschleifen. Schritt für Schritt vom Gedanken zur marktreifen Lösung."
  values:
    tagline: "WERTE"
    title: "Wofür wir stehen"
    subtitle: |-
      Unsere Werte sind nicht nur ein Marketingversprechen.
      Sie leiten Entscheidungen, im Produkt, im Team und im Umgang mit Partnern.

