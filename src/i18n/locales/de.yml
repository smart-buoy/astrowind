# Buoy section (Die Boje product page)
buoy:
  hero:
    tagline: "Die Boje"
    title: "Die Smarte Boje"
    subtitle: "Digitale Reservierung. Verlässliche Technik. Schutz für die Natur."
  cta:
    button: "Bleib auf dem Laufenden"
    banner-button: "Kontakt aufnehmen"
  newsletter-modal:
    intro: "Melde dich für unseren Newsletter an! So erfährst du als Erste/r, wann Verkauf und Buchung starten und bekommst Updates zu Features, Termine und nachhaltigen Bojenlösungen."
    close-label: "Newsletter-Dialog schließen"
    email-label: "E-Mail"
    disclaimer: "Mit dem Absenden des Formulars bestätigst du, dass du mit der Erhebung deiner personenbezogenen Daten einverstanden bist."
    hint: "Du kannst deine Einwilligung jederzeit widerrufen - am einfachsten, indem du den Widerruf an folgende E-Mail-Adresse schickst: <a href='mailto:office@smartbuoy.eu'>office@smartbuoy.eu</a>. Durch den Widerruf wird die Rechtmäßigkeit der aufgrund der Einwilligung bis zum Widerruf erfolgten Verarbeitung nicht berührt. Weitere Informationen findest du in unserer <a href='{privacyUrl}'>Datenschutzerklärung</a>."
    submit-button: "Newsletter abonnieren"
  tech:
    title: "Technische Details"
    subtitle: "Die wichtigsten technischen Daten der SmartBuoy Boje im Überblick."
    content: |-
      **Gehäusematerial:** CFK & GFK
      **Korrosionsschutz:** Meerwasserbeständige Komponenten aus dem Yachtbau
      **Schutzklasse:** IP67
      **Maße:**
      - Gesamthöhe inkl. Stab: ca. 1,0 m
      - Durchmesser: ca. 38 cm
      - Höhe Boje (ohne Stab): ca. 54 cm
      **Gewicht:** ca. 5 kg
      **Tragfähigkeit / Zugbelastung:** ca. 8.100 kg (vergleichbar mit einem 24-mm-Seil)
      **Kommunikation:** NB-IoT, LTE-M
      **GPS-Genauigkeit:** ca. 5-10 m (praxisabhängig)
      **Solar:** 4 × polykristalline Solarmodule, 12 V / 1,5 W
      **Batterie:** LFP (Lithium-Eisenphosphat)
      **Lebensdauer:** ca. 7 Jahre
      **Garantie / Gewährleistung:** Gesetzliche Gewährleistung (derzeit 2 Jahre)
      **Prüfungen & Zertifikate:**
      - TCKT Wels (Bewitterungstest, dynamische Prüfung, Druckprüfung)
      - CE-Kennzeichnung
  ecology:
    title: "Nachhaltigkeit & Ökologie"
    content: |-
      Der Schutz der Küsten ist ein zentrales Ziel von SmartBuoy.
      Durch digitale Buchung und klare Belegung reduzieren wir Such- und Fahrbewegungen auf dem Wasser, das spart Treibstoff und senkt CO₂-Emissionen.
      Die Boje ersetzt unkontrolliertes Ankern durch einen fix definierten, bodenschonenden Liegeplatz. So bleibt der Meeresboden als Lebensraum erhalten.

      Nachhaltigkeit zeigt sich auch im Produktdesign:
      - geplante Umstellung auf Naturfasern
      - wiederverwertbares Systemdesign
      - zweiter Lebenszyklus für elektronische Komponenten

      So verlängern wir die Nutzungsdauer, reduzieren Abfall und machen nachhaltige maritime Infrastruktur wirtschaftlich sinnvoll.

      SmartBuoy liefert Technik, die nicht nur funktioniert, sondern Verantwortung übernimmt.
  carousel:
    title: "Warum SmartBuoy"
    subtitle: "SmartBuoy verbindet verlässliche Technik mit intelligenter digitaler Steuerung und macht Anlegen sicherer, einfacher und effizienter."
    tagline: "Features"
  download:
    title: "Downloads"
    subtitle: "Benutzerhandbücher, Zertifikate und weitere Dokumente."
  faq:
    title: "Häufig gestellte Fragen"
    sub-title: "Hier sind einige häufig gestellte Fragen zur SmartBuoy-Hardware."
    tagline: "FAQ"

